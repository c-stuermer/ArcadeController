; --------------------------------------------------------------------------
; Project: Arcade Controller V1.1
; File: platformio.ini
; Description: PlatformIO configuration file defining the build environment,
;              library dependencies, and TFT display configuration.
; --------------------------------------------------------------------------

[env:dfrobot_firebeetle2_esp32e]
platform = espressif32
board = dfrobot_firebeetle2_esp32e
framework = arduino
monitor_speed = 115200

upload_port = COM5    
monitor_port = COM5

lib_deps = 
    ; --- Display & Graphics ---
    bodmer/TFT_eSPI @ ^2.5.43
    
    ; --- System & Hardware ---
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.0
    h2zero/NimBLE-Arduino @ 1.4.1
    lemmingdev/ESP32-BLE-Gamepad @ 0.5.2

build_flags = 
    -Wno-write-strings
    
    ; --- TFT_eSPI Configuration ---
    -D USER_SETUP_LOADED=1      ; Instructs the library to use these settings instead of external files
    -D ST7735_DRIVER=1          ; Display driver chip
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    
    ; --- Display Color Tab Configuration ---
    ; Select ONE of the following options matching your specific display hardware:
    ;-D ST7735_BLACKTAB=1
    ;-D ST7735_GREENTAB=1       
    -D ST7735_GREENTAB2=1       
    ;-D ST7735_GREENTAB3=1      

    ; --- Pin Mapping ---
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=0
    -D TFT_DC=12
    -D TFT_RST=19
    
    ; --- Fonts ---
    -D LOAD_GLCD=1              ; Load standard Adafruit font
    
    ; --- SPI Performance ---
    -D SPI_FREQUENCY=27000000   ; Set SPI frequency to 27 MHz for increased rendering speed